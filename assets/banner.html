<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1168px; height:409px; overflow:hidden;
    background:#0f1117;
    font-family:'Segoe UI',system-ui,sans-serif;
  }
  .bg {
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 70% 90% at 78% 50%, rgba(255,90,20,0.05) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 15% 50%, rgba(40,160,140,0.04) 0%, transparent 60%),
      linear-gradient(160deg, #0c0f16 0%, #151a24 45%, #0d1019 100%);
  }
  .layout {
    position:relative; z-index:2;
    display:flex; align-items:center;
    height:100%; padding:0 80px; gap:50px;
  }
  .crab {
    flex-shrink:0;
    filter:drop-shadow(0 6px 20px rgba(0,0,0,0.6));
  }
  .crab img {
    width:260px; height:234px;
    display:block; object-fit:contain;
  }
  .text { flex:1; }
  h1 {
    font-size:128px;
    font-weight:900;
    letter-spacing:-4px;
    line-height:1;
    /* match the original teal gradient exactly */
    background:linear-gradient(160deg, #8dffd8 0%, #5ee8be 35%, #3ecfaa 65%, #52ddb8 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:14px;
  }
  .sub {
    font-size:38px;
    font-weight:500;
    color:rgba(210,215,225,0.75);
    letter-spacing:0.2px;
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="layout">
  <div class="crab"><img src="crab.png"></div>
  <div class="text">
    <h1>KILLCLAWD</h1>
    <div class="sub">Kill the Crab</div>
  </div>
</div>
</body>
</html>
