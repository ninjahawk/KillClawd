<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:880px; height:310px; overflow:hidden;
    background:#181d2a;
    font-family:'Segoe UI',system-ui,sans-serif;
  }

  .bg {
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 60% 80% at 85% 50%, rgba(255,100,30,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 50% 80% at 10% 50%, rgba(50,180,160,0.07) 0%, transparent 60%),
      linear-gradient(135deg, #13171e 0%, #1a2035 50%, #13171e 100%);
  }
  .dots {
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size:30px 30px;
  }

  .layout {
    position:relative; z-index:2;
    display:flex; align-items:center;
    height:100%; padding:0 72px; gap:52px;
  }

  /* Sprite — crop to just the character area (100x65px at coords 100,208 in 302x300 canvas)
     Scaled 3x → character becomes 300x195px, cropped to 220x190 window centered on it */
  .sprite-wrap {
    flex-shrink:0;
    width:220px; height:230px;
    overflow:hidden; position:relative;
    filter:drop-shadow(0 0 30px rgba(255,120,40,0.3)) drop-shadow(0 8px 18px rgba(0,0,0,0.65));
  }
  .sprite-wrap img {
    position:absolute;
    width:906px; height:900px;  /* 302×300 × 3 */
    image-rendering:pixelated;
    /* character at 3x: x=300-600, y=624-819. Show y=609-839 with 15px padding */
    left:-340px;  /* 110 - 450 (center horizontally on character) */
    top:-609px;   /* 15px above character top (624-15=609) */
  }

  /* Text */
  .text { flex:1; }

  h1 {
    font-size:90px;
    font-weight:900;
    letter-spacing:-3px;
    line-height:1;
    background:linear-gradient(140deg, #7dffd8 0%, #5ee8c0 40%, #3dcaaa 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:10px;
  }

  .sub {
    font-size:26px;
    font-weight:400;
    color:rgba(255,255,255,0.48);
    letter-spacing:0.3px;
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="dots"></div>
<div class="layout">
  <div class="sprite-wrap">
    <img src="clawd-idle.gif">
  </div>
  <div class="text">
    <h1>KILLCLAWD</h1>
    <div class="sub">Kill the Crab</div>
  </div>
</div>
</body>
</html>
